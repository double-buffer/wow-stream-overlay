<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WoW Stream Overlay · Header</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        body {
            font-family: Arial, sans-serif;
            color: #f4f4f5;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            height: 150px;
            padding: 0 44px;
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .character,
        .mythic-plus,
        .mythic-score {
            display: flex;
            align-items: baseline;
        }

        .separator {
            margin: 0 12px;
            color: rgba(244, 244, 245, 0.45);
        }

        .item-level-value {
            color: #ff8a3d;
        }

        .mythic-level {
            color: rgb(0, 129, 255);
        }

        .mythic-plus,
        .mythic-score {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="character" data-visible-field="character" hidden>
            <span data-field="character.name"></span>
            <span class="separator">·</span>
            <span data-color-field="character.classColor"><span data-field="character.className"></span> <span data-field="character.specializationName"></span></span>
            <span class="separator">·</span>
            <span>iLvl: <span class="item-level-value" data-field="character.itemLevel"></span></span>
        </div>

        <div class="mythic-score" data-visible-field="character.mythicPlusScore" data-hidden-field="mythicPlus" hidden>
            <span>Score Mythic+: <span class="mythic-level" data-field="character.mythicPlusScore"></span></span>
        </div>

        <div class="mythic-plus" data-visible-field="mythicPlus" hidden>
            <span data-field="mythicPlus.dungeonName"></span>
            <span class="separator">·</span>
            <span class="mythic-level">+<span data-field="mythicPlus.level"></span></span>
        </div>
    </header>
</body>
</html>
