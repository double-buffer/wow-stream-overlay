<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WoW Stream Overlay · Header</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f4f4f5;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            height: 104px;
            padding: 0 44px;
            background: rgba(17, 18, 23, 0.98);
            font-size: 30px;
            font-weight: 700;
            white-space: nowrap;
        }

        .character,
        .mythic-plus {
            display: flex;
            align-items: baseline;
        }

        .class-specialization {
            color: #c79c6e;
        }

        .separator {
            margin: 0 12px;
            color: rgba(244, 244, 245, 0.45);
        }

        .item-level-value,
        .mythic-level {
            color: #ff8a3d;
        }

        .mythic-plus {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="character" data-visible-field="character">
            <span data-field="character.name"></span>
            <span class="separator">·</span>
            <span class="class-specialization"><span data-field="character.className"></span> <span data-field="character.specializationName"></span></span>
            <span class="separator">·</span>
            <span>iLvl: <span class="item-level-value" data-field="character.itemLevel"></span></span>
        </div>

        <div class="mythic-plus" data-visible-field="mythicPlus">
            <span data-field="mythicPlus.dungeonName"></span>
            <span class="separator">·</span>
            <span>+<span class="mythic-level" data-field="mythicPlus.level"></span></span>
        </div>
    </header>
</body>
</html>
