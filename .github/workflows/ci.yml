name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WoWStreamOverlay.slnx

      - name: Build
        run: dotnet build WoWStreamOverlay.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WoWStreamOverlay.slnx --configuration Release --no-build --verbosity normal

      - name: Validate trimmed Windows publish
        run: |
          dotnet publish src/WoWStreamOverlay/WoWStreamOverlay.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --output "${{ runner.temp }}/publish-check"

      - name: Validate release notes script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ".github/scripts/release-notes.ps1"),
              [ref]$tokens,
              [ref]$errors) | Out-Null

          if ($errors.Count -gt 0)
          {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
